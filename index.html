<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Dashboard - Glassmorphic</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen text-slate-100 p-4 md:p-8 font-sans">

  <!-- Container Utama -->
  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="glass-card p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400">
          Social Media Hub
        </h1>
        <p class="text-xs md:text-sm text-slate-400">Kelola akun, kredensial, & akses cepat</p>
      </div>
      <button onclick="openModal()" class="w-full sm:w-auto bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg hover:shadow-pink-500/25 transition-all flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-5 h-5"></i> Tambah Akun
      </button>
    </header>

    <!-- Filter & Search -->
    <div class="glass-card p-4 flex flex-col sm:flex-row gap-4">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="renderCards()" placeholder="Cari nama platform, username, atau email..." class="w-full pl-10 pr-4 py-2 bg-slate-900/50 border border-slate-700/50 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-pink-500 transition-all">
      </div>
    </div>

    <!-- Grid Kartu Akun -->
    <div id="accountGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading State / Content akan di-render lewat JavaScript -->
    </div>

  </div>

  <!-- Modal Form (Tambah / Edit) -->
  <div id="accountModal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden justify-center items-center p-4 z-50">
    <div class="glass-card max-w-lg w-full p-6 space-y-4 relative max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-700/50 pb-3">
        <h3 id="modalTitle" class="text-lg font-bold text-slate-100">Tambah Akun Baru</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-100"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>

      <form id="accountForm" onsubmit="saveAccount(event)" class="space-y-3 text-sm">
        <input type="hidden" id="accountId" />
        
        <div>
          <label class="block text-slate-300 mb-1">Nama Platform / App</label>
          <input type="text" id="platform_name" placeholder="misal: Instagram, TikTok" class="form-input" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 mb-1">Username</label>
            <input type="text" id="username" placeholder="@username" class="form-input" />
          </div>
          <div>
            <label class="block text-slate-300 mb-1">Email</label>
            <input type="email" id="email" placeholder="user@mail.com" class="form-input" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 mb-1">Password</label>
            <input type="password" id="password" placeholder="••••••••" class="form-input" />
          </div>
          <div>
            <label class="block text-slate-300 mb-1">Kategori</label>
            <select id="category" class="form-input bg-slate-900">
              <option value="Personal">Personal</option>
              <option value="Work">Pekerjaan</option>
              <option value="Client">Klien</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-slate-300 mb-1">URL Web / Aplikasi</label>
          <input type="url" id="app_url" placeholder="https://..." class="form-input" />
        </div>

        <div>
          <label class="block text-slate-300 mb-1">Ikon Lucide (Optional)</label>
          <input type="text" id="icon_name" placeholder="instagram, twitter, globe, lock, dll" class="form-input" />
        </div>

        <div>
          <label class="block text-slate-300 mb-1">Catatan Tambahan</label>
          <textarea id="notes" rows="2" placeholder="Nomor pemulihan, PIN 2FA, dll" class="form-input"></textarea>
        </div>

        <p class="text-xs text-slate-400 italic">*Isi minimal 1 kolom di atas untuk menyimpan.</p>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">Batal</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-pink-600 text-white font-medium hover:bg-pink-500">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
